<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Hillgate Finance — Complaint form</title>
<style>
  :root {
    --navy: #0b2545;
    --ink: #1a1a1a;
    --muted: #5b6472;
    --line: #e3e6ea;
    --line-2: #eef0f3;
    --soft: #f8f9fb;
  }
  * { box-sizing: border-box; }
  html, body {
    margin: 0;
    padding: 0;
    font-family: "Inter", -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
    color: var(--ink);
    background: var(--soft);
    -webkit-font-smoothing: antialiased;
  }
  .wrap { padding: 40px; }
  .crumbs { font-size: 13px; color: var(--muted); margin-bottom: 16px; }
  .crumbs a { text-decoration: none; color: var(--navy); }

  .form-card {
    background: #fff; border: 1px solid var(--line); border-radius: 8px;
    padding: 32px; max-width: 760px;
  }
  .form-note {
    font-size: 13px; color: var(--muted);
    background: #eef3fb; border: 1px solid #d6e1f1;
    border-radius: 6px; padding: 10px 14px; margin: 0 0 24px;
  }
  .form-row { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; margin-bottom: 16px; }
  .field { display: flex; flex-direction: column; }
  .field.full { grid-column: 1 / -1; }
  .field label { font-size: 13px; font-weight: 500; margin-bottom: 6px; }
  .field label .opt { color: var(--muted); font-weight: 400; margin-left: 4px; }
  .field input, .field select, .field textarea {
    font: inherit; padding: 10px 12px; border: 1px solid var(--line);
    border-radius: 6px; background: #fff; color: var(--ink); font-size: 14px; outline: none;
  }
  .field input:focus, .field select:focus, .field textarea:focus {
    border-color: var(--navy); box-shadow: 0 0 0 3px rgba(11,37,69,0.08);
  }
  .field textarea { resize: vertical; min-height: 100px; line-height: 1.5; }

  .upload {
    border: 1.5px dashed #c9cfd8; border-radius: 6px; padding: 24px;
    text-align: center; background: #fafbfc; color: var(--muted); font-size: 13px;
  }
  .upload strong { color: var(--ink); font-weight: 500; }
  .upload .browse { color: var(--navy); text-decoration: underline; cursor: pointer; }
  .upload .formats { display: block; margin-top: 6px; font-size: 12px; }

  .check {
    display: flex; align-items: flex-start; gap: 10px;
    font-size: 13px; line-height: 1.5; margin: 4px 0 20px;
  }
  .check input { margin-top: 2px; }

  .btn {
    display: inline-block; padding: 12px 22px; border-radius: 6px;
    font-size: 15px; font-weight: 500; border: 1px solid var(--navy);
    background: var(--navy); color: #fff; cursor: pointer;
  }
  .form-actions {
    display: flex; align-items: center; gap: 16px;
    border-top: 1px solid var(--line-2); padding-top: 20px;
  }
  .form-actions .meta { font-size: 12px; color: var(--muted); }
</style>
</head>
<body>

<div class="wrap">
  <div class="crumbs"><a href="#">Home</a> &nbsp;/&nbsp; <a href="#">Complaints</a> &nbsp;/&nbsp; <span>Submit a complaint</span></div>

  <form class="form-card" onsubmit="event.preventDefault();">
    <p class="form-note">Filing a complaint is free of charge. You can submit in English or Dutch.</p>

    <div class="form-row">
      <div class="field"><label>Full name</label><input type="text" placeholder="Jane Doe" /></div>
      <div class="field"><label>Email</label><input type="email" placeholder="jane@example.com" /></div>
    </div>

    <div class="form-row">
      <div class="field"><label>Phone <span class="opt">(optional)</span></label><input type="tel" placeholder="+31 20 000 0000" /></div>
      <div class="field"><label>Hillgate account reference <span class="opt">(optional, for existing clients)</span></label><input type="text" placeholder="HG-XXXXXX" /></div>
    </div>

    <div class="form-row">
      <div class="field full"><label>Residential address</label><input type="text" placeholder="Street, number, postcode, city, country" /></div>
    </div>

    <div class="form-row">
      <div class="field">
        <label>Service the complaint relates to</label>
        <select>
          <option>Select a service…</option>
          <option>Custody of crypto-assets</option>
          <option>Exchange of crypto-assets for funds</option>
          <option>Exchange of crypto-assets for other crypto-assets</option>
          <option>Transfer services</option>
          <option>Other</option>
        </select>
      </div>
      <div class="field"><label>Date of the event</label><input type="date" /></div>
    </div>

    <div class="form-row">
      <div class="field full"><label>Description of the complaint</label><textarea placeholder="Please describe what happened, including any reference numbers, dates, and people you spoke with."></textarea></div>
    </div>

    <div class="form-row">
      <div class="field full"><label>Desired outcome</label><textarea placeholder="What outcome are you hoping for?"></textarea></div>
    </div>

    <div class="form-row">
      <div class="field full">
        <label>Supporting documents</label>
        <div class="upload">
          <strong>Drag and drop files here</strong> or <span class="browse">browse</span>
          <span class="formats">PDF, PNG, JPG, DOCX — up to 25 MB total</span>
        </div>
      </div>
    </div>

    <label class="check">
      <input type="checkbox" />
      <span>I confirm the information provided is accurate to the best of my knowledge.</span>
    </label>

    <div class="form-actions">
      <button class="btn" type="submit">Submit complaint</button>
      <span class="meta">You'll receive an email acknowledgement at the address provided.</span>
    </div>
  </form>
</div>

</body>
</html>
